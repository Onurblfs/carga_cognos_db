# ============================================================
# Mapeia cada exportacao do att_cognos_pbi para uma tabela do banco.
#
# Campos:
#   nome        : deve ser IGUAL ao campo "nome" da exportacao no
#                 config.json do att_cognos_pbi
#   tabela      : nome da tabela de destino no banco
#   schema      : schema da tabela (opcional; usa DB_SCHEMA do .env)
#   modo_carga  : substituir -> TRUNCATE + INSERT (mantem a estrutura)
#                 recriar    -> DROP + CREATE (estrutura inferida dos dados)
#                 anexar     -> apenas INSERT (acumula historico)
#   aba         : nome ou indice da aba do Excel (padrao: 0 = primeira)
#   linhas_pular: linhas de titulo/contexto a pular antes do cabecalho
#                 (ajuste na primeira execucao olhando o Excel exportado)
# ============================================================

fontes:
  - nome: "Receitas (IRAT.950)"
    tabela: tb_irat950_receita
    modo_carga: substituir
    aba: 0
    linhas_pular: 0

  - nome: "Fisicos (FIS.900)"
    tabela: tb_fis900_fisico
    modo_carga: substituir
    aba: 0
    linhas_pular: 0

  - nome: "Custos (IRAT.950 Custo)"
    tabela: tb_irat950_custo
    modo_carga: substituir
    aba: 0
    linhas_pular: 0

  - nome: "Abertura da Receita / Waterfall (REV.900)"
    tabela: tb_rev900_receita_abertura
    modo_carga: substituir
    aba: 0
    linhas_pular: 0

  - nome: "Pre-Pago Parte 1 (CTS.100)"
    tabela: tb_cts100_prepago
    modo_carga: substituir
    aba: 0
    linhas_pular: 0

  - nome: "Pre-Pago Parte 2 (REV.420)"
    tabela: tb_rev420_prepago
    modo_carga: substituir
    aba: 0
    linhas_pular: 0
