# ============================================================
# Cadastro das fontes de dados do Cognos e das tabelas de destino.
#
# Cada item da lista "fontes" representa um relatorio/fonte do Cognos
# que sera baixado e gravado em uma tabela do banco.
#
# Campos:
#   nome          : nome amigavel da fonte (aparece nos logs)
#   store_id      : storeID do relatorio no Cognos.
#                   Para descobrir: no Cognos, abra as propriedades do
#                   relatorio > aba "Geral" > "ID" (algo como
#                   i5F2E...). Tambem funciona o "search path".
#   formato       : formato de saida do relatorio (CSV ou spreadsheetML)
#   tabela        : nome da tabela de destino no banco
#   schema        : schema da tabela (opcional; usa DB_SCHEMA do .env se vazio)
#   modo_carga    : substituir  -> TRUNCATE + INSERT (mantem estrutura da tabela)
#                   recriar     -> DROP + CREATE (estrutura inferida do DataFrame)
#                   anexar      -> apenas INSERT (acumula historico)
#   parametros    : (opcional) prompts/parametros do relatorio, ex:
#                   parametros:
#                     p_data_inicio: "2026-01-01"
#                     p_regiao: "SP"
# ============================================================

fontes:
  - nome: exemplo_relatorio_vendas
    store_id: "iCOLE_AQUI_O_STORE_ID"
    formato: CSV
    tabela: tb_cognos_vendas
    schema: dbo
    modo_carga: substituir

